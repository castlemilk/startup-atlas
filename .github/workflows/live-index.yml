name: Build live index
# Async indexer for the live-index pipeline (docs/LIVE-INDEX.md): rebuilds the
# versioned Parquet index from the reviewed corpus in object storage and
# publishes it to the public index bucket, where the DuckDB query console
# reads the latest version. Never writes to Git.
#
# Triggering (F1 reliability, 26 Nov 2026): merged data reaches the corpus via
# the "Publish reviewed corpus" workflow, which never dispatched the indexer —
# the indexer relied on the */15 poll below, and GitHub dropped that
# schedule's ticks for hours at a time (last scheduled run 02:33Z, ~7 ticks
# missed, F1 red three times in one day). The workflow_run chain is now the
# primary path for git-merged data: it fires when a corpus publish completes
# on main, so the corpus is already in the store when the indexer reads it.
# The poll stays as the backstop for any missed dispatch, repository_dispatch
# covers the crawl and MCP writers (they dispatch corpus-updated themselves),
# and the indexer exits in seconds when the corpus manifest is unchanged, so
# extra triggers are cheap. The live-index concurrency group below serialises
# chained, scheduled and dispatched runs so publishes never interleave.
on:
  workflow_run:
    workflows: ['Publish reviewed corpus']
    types: [completed]
    branches: [main]
  schedule:
    # Poll: covers every writer (crawl, MCP, manual upload) even if a
    # repository_dispatch is missed. A no-change run exits in seconds.
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [corpus-updated]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: live-index
  cancel-in-progress: false
jobs:
  index:
    # A chained run only makes sense once the corpus publish succeeded;
    # every other trigger (schedule, dispatch) runs unconditionally.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      ATLAS_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP (Workload Identity Federation)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Parquet build dependency
        run: pip install pyarrow
      - name: Build and publish the live index
        env:
          ATLAS_CORPUS_BACKEND: gcs
          ATLAS_CORPUS_BUCKET: ${{ secrets.ATLAS_CORPUS_BUCKET }}
          ATLAS_CORPUS_INDEX_BUCKET: ${{ secrets.ATLAS_CORPUS_INDEX_BUCKET }}
          ATLAS_GCP_PROJECT: ${{ secrets.ATLAS_GCP_PROJECT }}
          ATLAS_GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          ATLAS_SOURCE_REVISION: ${{ github.sha }}
        run: |
          if [ -z "$ATLAS_CORPUS_BUCKET" ]; then
            echo "Object storage is not configured; validating the indexer against the repo data/ files only (no publish)."
            python3 scripts/build_live_index.py --corpus-dir data --out live-index
            exit 0
          fi
          # First run: the corpus bucket has no reviewed files yet, so seed it
          # from this checkout; later runs read from the store.
          python3 scripts/build_live_index.py --corpus-store --bootstrap-from data --out live-index --publish
