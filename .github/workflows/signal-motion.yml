name: Validate Signal motion pilot

on:
  pull_request:
    branches: [main]
    paths:
      - web/assets/design-lab/signal-motion-pilot/**
      - web/assets/design-lab/signal-search.webp
      - web/assets/design-lab/signal-treemap.webp
      - web/assets/design-lab/signal-graph.webp
      - web/design-tokens.css
      - web/assets/fonts/**
      - package.json
      - package-lock.json
      - scripts/build.mjs
      - scripts/test-signal-motion-browser.mjs
      - .github/workflows/signal-motion.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATLAS_SOURCE_REVISION: ${{ github.sha }}
      ATLAS_SCREENSHOTS_DIR: ${{ runner.temp }}/startup-atlas-signal-motion
      CHROME_BIN: google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing site dependencies
        run: npm ci --ignore-scripts
      - name: Build the static site
        run: npm run build
      - name: Verify artwork motion and static alternatives in Chrome
        run: node scripts/test-signal-motion-browser.mjs
      - name: Preserve screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-motion-review
          path: ${{ runner.temp }}/startup-atlas-signal-motion/
          if-no-files-found: warn
          retention-days: 7
