name: Validate Signal motion pilot

on:
  pull_request:
    branches: [main]
    paths:
      - web/assets/design-lab/signal-motion-pilot/**
      - web/assets/design-lab/signal-search.webp
      - web/assets/design-lab/signal-treemap.webp
      - web/assets/design-lab/signal-graph.webp
      - web/design-tokens.css
      - web/assets/fonts/**
      - .nvmrc
      - package.json
      - package-lock.json
      - scripts/build.mjs
      - scripts/test-signal-motion-browser.mjs
      - .github/workflows/signal-motion.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATLAS_SOURCE_REVISION: ${{ github.sha }}
      CHROME_BIN: google-chrome
    steps:
      - uses: actions/checkout@v4
      - name: Probe provisioned toolchain
        id: toolchain
        run: python3 scripts/toolchain.py probe >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.toolchain.outputs.node_ready != 'true'
        with:
          node-version-file: .nvmrc
      - name: Record npm version
        id: npmver
        run: echo "version=$(npm --version)" >> "$GITHUB_OUTPUT"
      - name: Restore npm download cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: atlas-npm-${{ runner.os }}-${{ runner.arch }}-node26.13.1-npm${{ steps.npmver.outputs.version }}-${{ hashFiles('package-lock.json', 'backend/mcp/package-lock.json', 'backend/hosted/package-lock.json') }}
          restore-keys: |
            atlas-npm-${{ runner.os }}-${{ runner.arch }}-node26.13.1-
      - name: Verify Node and Chrome toolchain versions
        run: python3 scripts/toolchain.py check --only node,chrome
      - name: Install existing site dependencies
        run: npm ci --ignore-scripts
      - name: Build static browser fixtures
        # The pilot serves HTML, CSS and artwork; SQLite and Parquet are release-only here.
        run: |
          npm run data:generate
          node scripts/build.mjs
      - name: Verify artwork motion and static alternatives in Chrome
        run: node scripts/test-signal-motion-browser.mjs
        env:
          ATLAS_SCREENSHOTS_DIR: ${{ runner.temp }}/startup-atlas-signal-motion
      - name: Preserve screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-motion-review
          path: ${{ runner.temp }}/startup-atlas-signal-motion/
          if-no-files-found: warn
          retention-days: 7
      - name: Save npm download cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.npm
          key: atlas-npm-${{ runner.os }}-${{ runner.arch }}-node26.13.1-npm${{ steps.npmver.outputs.version }}-${{ hashFiles('package-lock.json', 'backend/mcp/package-lock.json', 'backend/hosted/package-lock.json') }}
