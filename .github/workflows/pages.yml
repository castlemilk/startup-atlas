name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ATLAS_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies
        run: npm ci --ignore-scripts
      - name: Install MCP dependencies
        run: npm ci --prefix mcp --ignore-scripts
      - name: Validate MCP protocol and persistence
        run: npm run test:mcp
      - name: Validate hosted OAuth implementation
        run: |
          npm ci --prefix hosted --ignore-scripts
          npm --prefix hosted test
          npm --prefix hosted run build
      - name: Validate catalogue and filtering
        run: npm test
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate Connect graph service
        run: go test -mod=readonly ./internal/graph ./api
      - name: Build static site
        run: npm run build
      - name: Smoke test the graph explorer
        run: |
          node scripts/smoke-graph-ui.mjs
          node scripts/smoke-graph-ui.mjs query
          node scripts/smoke-graph-ui.mjs fallback
          node scripts/smoke-graph-ui.mjs unavailable
          node scripts/smoke-entity-ui.mjs
          node scripts/smoke-entity-ui.mjs fallback
          node scripts/smoke-entity-ui.mjs person
          node scripts/smoke-entity-ui.mjs person-fallback
          node scripts/smoke-entity-ui.mjs programme
          node scripts/smoke-entity-ui.mjs programme-fallback
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Verify published graph and database
        run: python3 scripts/verify-published-graph.py
