name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies
        run: npm ci --ignore-scripts
      - name: Install MCP dependencies
        run: npm ci --prefix mcp --ignore-scripts
      - name: Validate MCP protocol and persistence
        run: npm run test:mcp
      - name: Validate hosted OAuth implementation
        run: |
          npm ci --prefix hosted --ignore-scripts
          npm --prefix hosted test
          npm --prefix hosted run build
      - name: Validate catalogue and filtering
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
