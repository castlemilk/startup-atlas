name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ATLAS_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check patch and select tests
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          # With a shallow PR merge checkout, its first parent is the base tree
          # that was actually tested, even if main advanced after the event.
          atlas_pr_base=$(git rev-parse --verify HEAD^1)
          git diff --check "$atlas_pr_base" HEAD
          python3 scripts/check_ci_paths.py "$atlas_pr_base" >> "$GITHUB_OUTPUT"
      - name: Check CI routing
        if: steps.changes.outputs.ci == 'true'
        run: python3 -m unittest discover -s tests -p 'test_ci_paths.py'
      - name: Generate catalogue and graph for selected checks
        if: steps.changes.outputs.data == 'true' || steps.changes.outputs.web == 'true'
        run: npm run data:generate
      - name: Validate changed data and provenance
        if: steps.changes.outputs.data == 'true'
        run: |
          node --test tests/catalogue.test.js tests/graph-data.test.js
          python3 -m unittest discover -s tests -p 'test_graph.py'
      - name: Check search, relationships and financial views
        if: steps.changes.outputs.web == 'true'
        run: node --test tests/fuzzy-search.test.js tests/graph-layout.test.js tests/treemap.test.js tests/analytics.test.js
      - name: Validate collection boundaries and saved evidence
        if: steps.changes.outputs.collection == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_crawl*.py'
          python3 -m unittest discover -s tests -p 'test_company*.py'
          python3 -m unittest discover -s tests -p 'test_collection_coverage.py'
          python3 -m unittest discover -s tests -p 'test_scoped_implementation.py'
          python3 -m unittest discover -s tests -p 'test_early_investments.py'
      - name: Check country research indexing
        if: steps.changes.outputs.research == 'true'
        run: python3 -m unittest discover -s tests -p 'test_country_research_index.py'
      - name: Run MCP checks
        if: steps.changes.outputs.mcp == 'true'
        run: |
          npm ci --prefix backend/mcp --ignore-scripts
          npm run test:mcp
      - name: Run hosted MCP and OAuth checks
        if: steps.changes.outputs.hosted == 'true'
        run: |
          npm ci --prefix backend/hosted --ignore-scripts
          npm --prefix backend/hosted test
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod
      - name: Validate Connect graph service
        if: steps.changes.outputs.go == 'true'
        run: go test -mod=readonly ./backend/internal/graph ./api
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          node-version: '22'
      - name: Install site dependencies
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm ci --ignore-scripts
      - name: Build the Pages snapshot
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published graph and design microsite
        run: python3 scripts/verify-published-graph.py
