name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ATLAS_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Probe provisioned toolchain
        id: toolchain
        run: python3 scripts/toolchain.py probe >> "$GITHUB_OUTPUT"
      - name: Record npm version
        id: npmver
        run: echo "version=$(npm --version)" >> "$GITHUB_OUTPUT"
      - name: Restore npm download cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: atlas-npm-${{ runner.os }}-${{ runner.arch }}-node22-npm${{ steps.npmver.outputs.version }}-${{ hashFiles('package-lock.json', 'backend/mcp/package-lock.json', 'backend/hosted/package-lock.json') }}
          restore-keys: |
            atlas-npm-${{ runner.os }}-${{ runner.arch }}-node22-
      - name: Check patch and select tests
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          # With a shallow PR merge checkout, its first parent is the base tree
          # that was actually tested, even if main advanced after the event.
          atlas_pr_base=$(git rev-parse --verify HEAD^1)
          git diff --check "$atlas_pr_base" HEAD
          python3 scripts/check_ci_paths.py "$atlas_pr_base" >> "$GITHUB_OUTPUT"
      - name: Check CI routing
        if: steps.changes.outputs.ci == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_ci_paths.py'
          python3 -m unittest discover -s tests -p 'test_toolchain_contract.py'
      - name: Record shadow test selection
        # Issue #150 (A4): inside this existing full run, record what the
        # dependency-aware selector would have executed for the pushed
        # diff. Record only — the full run below is unchanged and the
        # shadow report never gates it.
        if: github.event_name == 'push'
        run: |
          python3 scripts/check_ci_paths.py --shadow HEAD^1 | tee shadow-selection.json
          {
            echo '### Shadow test selection (record only)'
            echo '```json'
            cat shadow-selection.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate catalogue and graph for selected checks
        if: steps.changes.outputs.data == 'true' || steps.changes.outputs.web == 'true'
        run: npm run data:generate
      - name: Validate changed data and provenance
        if: steps.changes.outputs.data == 'true'
        run: |
          node --test tests/catalogue.test.js tests/graph-data.test.js
          python3 -m unittest discover -s tests -p 'test_entity_resolution.py'
          python3 -m unittest discover -s tests -p 'test_accelerator_deals.py'
          python3 -m unittest discover -s tests -p 'test_graph.py'
          python3 -m unittest discover -s tests -p 'test_query_parquet.py'
          python3 -m unittest tests.test_live_index.ReviewedValuationInputTests
      - name: Check search, relationships and financial views
        if: steps.changes.outputs.web == 'true'
        run: node --test tests/fuzzy-search.test.js tests/graph-layout.test.js tests/treemap.test.js tests/analytics.test.js
      - name: Validate collection boundaries and saved evidence
        if: steps.changes.outputs.collection == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_crawl*.py'
          python3 -m unittest discover -s tests -p 'test_company*.py'
          python3 -m unittest discover -s tests -p 'test_collection_coverage.py'
          python3 -m unittest discover -s tests -p 'test_scoped_implementation.py'
          python3 -m unittest discover -s tests -p 'test_early_investments.py'
      - name: Validate review queue and valuation evidence
        if: steps.changes.outputs.queue == 'true'
        run: python3 -m unittest tests.test_review_queue tests.test_review_gating tests.test_valuation_queue tests.test_entity_resolution
      - name: Check country research indexing
        if: steps.changes.outputs.research == 'true'
        run: python3 -m unittest discover -s tests -p 'test_country_research_index.py'
      - name: Run MCP checks
        if: steps.changes.outputs.mcp == 'true'
        run: |
          npm ci --prefix backend/mcp --ignore-scripts
          npm run test:mcp
      - name: Run hosted MCP and OAuth checks
        if: steps.changes.outputs.hosted == 'true'
        run: |
          npm ci --prefix backend/hosted --ignore-scripts
          npm --prefix backend/hosted test
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.go == 'true' && steps.toolchain.outputs.go_ready != 'true'
        with:
          go-version-file: go.mod
      - name: Verify Go toolchain version
        if: steps.changes.outputs.go == 'true'
        run: python3 scripts/toolchain.py check --only go
      - name: Validate Connect graph service
        if: steps.changes.outputs.go == 'true'
        run: go test -mod=readonly ./backend/internal/graph ./api
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.toolchain.outputs.node_ready != 'true'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.toolchain.outputs.python_ready != 'true'
        with:
          python-version: '3.12'
      - name: Install site dependencies
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        if: ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || steps.changes.outputs.ci == 'true') && steps.toolchain.outputs.python_ready != 'true'
        with:
          python-version: '3.12'
      - name: Verify Python toolchain version
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || steps.changes.outputs.ci == 'true'
        run: python3 scripts/toolchain.py check --only python
      - name: Install Parquet build dependency
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 -m pip install pyarrow
      - name: Verify Node toolchain version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 scripts/toolchain.py check --only node
      - name: Check identity registry matches its builder
        # Issue #516: admin panel / admin MCP write-backs commit
        # data/review-queue.json straight to main, and the identity
        # registry is a build output of those decisions. Nothing else
        # runs Python tests on a push to main, so without this step a
        # drifted data/identity.json is only caught by a later PR.
        # Fail the build before publishing when the committed registry
        # differs from build_registry() over the same inputs.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 -m unittest tests.test_entity_resolution.SeedTests.test_seeded_registry_file_loads_and_matches_builder
      - name: Build the Pages snapshot
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Save npm download cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.npm
          key: atlas-npm-${{ runner.os }}-${{ runner.arch }}-node22-npm${{ steps.npmver.outputs.version }}-${{ hashFiles('package-lock.json', 'backend/mcp/package-lock.json', 'backend/hosted/package-lock.json') }}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Probe provisioned toolchain
        id: toolchain
        run: python3 scripts/toolchain.py probe >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.toolchain.outputs.node_ready != 'true'
        with:
          node-version: '22'
      - name: Verify Node toolchain version
        run: python3 scripts/toolchain.py check --only node
      - name: Verify published graph and design microsite
        run: python3 scripts/verify-published-graph.py
