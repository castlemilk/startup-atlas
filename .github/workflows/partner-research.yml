name: Partner research crawl
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate current catalogue
        run: python3 scripts/make-data.py
      - name: Discover partner directory leads
        run: python3 scripts/crawl.py partners --follow 0
      - name: Discover programme directory leads
        # A programme-directory outage degrades this step's snapshot only;
        # it must never skip the news, logo, profile and portrait steps.
        run: python3 scripts/crawl.py programs --follow 0
        continue-on-error: true
      - name: Discover startup news leads
        run: python3 scripts/crawl.py news --follow 2
        continue-on-error: true
      - name: Stage approved partner logos
        run: python3 scripts/crawl.py logos --approved data/partner-logo-seeds.csv --partners-only --follow 0 --logo-limit 3
      - name: Discover team and portfolio leads
        run: python3 scripts/crawl.py profiles --approved data/partner-logo-seeds.csv --follow 2 --limit 32
      - name: Stage founder and team portraits
        run: python3 scripts/crawl.py portraits --approved data/company-profile-seeds.csv --follow 2
      - name: Prepare partner metadata for review
        run: python3 scripts/crawl.py partner-candidates --approved data/partner-logo-seeds.csv --snapshot research/crawl/latest-logos.json
      - name: Summarize outputs
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for mode in ('partners', 'programs', 'news', 'logos', 'profiles', 'portraits'):
              path = Path('research/crawl') / f'latest-{mode}.json'
              if not path.exists():
                  print(f'{mode}: no snapshot')
                  continue
              data = json.loads(path.read_text())
              print(f"{mode}: {len(data.get('results', []))} sources; {len(data.get('candidates', []))} candidates")
              for row in data.get('results', []):
                  print(f"  {row.get('name')}: " + ', '.join(p.get('status', 'unknown') for p in row.get('pages', [])))
              for item in data.get('candidates', []) if mode == 'logos' else []:
                  print(f"  {item.get('partner')}: {item.get('kind')} {item.get('status')} {item.get('url')} {item.get('reason', '')}")
              for item in data.get('candidates', []) if mode == 'portraits' else []:
                  if item.get('kind') == 'portrait':
                      print(f"  {item.get('company')}: portrait {item.get('name')} {item.get('status')} {item.get('candidate_url')} {item.get('reason', '')}")
              for note in data.get('notes', []):
                  print(f"  note: {note}")
          PY
      - name: Preserve review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-crawl-review
          path: research/crawl/
          if-no-files-found: warn
          retention-days: 14
      - name: Authenticate to GCP (Workload Identity Federation)
        id: gcp-auth
        if: always()
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Publish crawl snapshots to the live-index corpus
        # High-throughput push: snapshots land in object storage immediately;
        # the async indexer (live-index.yml) picks them up from there. This
        # step never fails the crawl, and skips cleanly until the
        # ATLAS_CORPUS_* secrets exist.
        if: always()
        continue-on-error: true
        env:
          ATLAS_CORPUS_BACKEND: gcs
          ATLAS_CORPUS_BUCKET: ${{ secrets.ATLAS_CORPUS_BUCKET }}
          ATLAS_CORPUS_INDEX_BUCKET: ${{ secrets.ATLAS_CORPUS_INDEX_BUCKET }}
          ATLAS_GCP_PROJECT: ${{ secrets.ATLAS_GCP_PROJECT }}
          ATLAS_GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: python3 scripts/publish_crawl_corpus.py --snapshots research/crawl --run-id ${{ github.run_id }}
