name: Partner research crawl
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    # Issue #535: the company-profiles step adds a second full pass over
    # the approved company seeds on top of the portraits pass, so the job
    # budget grows from 15 to 30 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate to GCP (Workload Identity Federation)
        id: gcp-auth
        if: always()
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Generate current catalogue
        run: python3 scripts/make-data.py
      - name: Discover partner directory leads
        env:
          ATLAS_CRAWL_PROGRESS: "1"
          ATLAS_CORPUS_BACKEND: gcs
          ATLAS_CORPUS_BUCKET: ${{ secrets.ATLAS_CORPUS_BUCKET }}
          ATLAS_CORPUS_INDEX_BUCKET: ${{ secrets.ATLAS_CORPUS_INDEX_BUCKET }}
          ATLAS_GCP_PROJECT: ${{ secrets.ATLAS_GCP_PROJECT }}
          ATLAS_GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: python3 scripts/crawl.py partners --follow 0
      - name: Discover programme directory leads
        # A programme-directory outage degrades this step's snapshot only;
        # it must never skip the news, logo, profile and portrait steps.
        env:
          ATLAS_CRAWL_PROGRESS: "1"
          ATLAS_CORPUS_BACKEND: gcs
          ATLAS_CORPUS_BUCKET: ${{ secrets.ATLAS_CORPUS_BUCKET }}
          ATLAS_CORPUS_INDEX_BUCKET: ${{ secrets.ATLAS_CORPUS_INDEX_BUCKET }}
          ATLAS_GCP_PROJECT: ${{ secrets.ATLAS_GCP_PROJECT }}
          ATLAS_GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: python3 scripts/crawl.py programs --follow 0
        continue-on-error: true
      - name: Discover startup news leads
        env:
          ATLAS_CRAWL_PROGRESS: "1"
          ATLAS_CORPUS_BACKEND: gcs
          ATLAS_CORPUS_BUCKET: ${{ secrets.ATLAS_CORPUS_BUCKET }}
          ATLAS_CORPUS_INDEX_BUCKET: ${{ secrets.ATLAS_CORPUS_INDEX_BUCKET }}
          ATLAS_GCP_PROJECT: ${{ secrets.ATLAS_GCP_PROJECT }}
          ATLAS_GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: python3 scripts/crawl.py news --follow 2
        continue-on-error: true
      - name: Stage approved partner logos
        env:
          ATLAS_CRAWL_PROGRESS: "1"
          ATLAS_CORPUS_BACKEND: gcs
          ATLAS_CORPUS_BUCKET: ${{ secrets.ATLAS_CORPUS_BUCKET }}
          ATLAS_CORPUS_INDEX_BUCKET: ${{ secrets.ATLAS_CORPUS_INDEX_BUCKET }}
          ATLAS_GCP_PROJECT: ${{ secrets.ATLAS_GCP_PROJECT }}
          ATLAS_GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: python3 scripts/crawl.py logos --approved data/partner-logo-seeds.csv --partners-only --follow 0 --logo-limit 3
      - name: Discover team and portfolio leads
        # Issue #350: the limit used to be a literal 32 that silently
        # truncated the crawl the day a 33rd seed was added. Derive it
        # from the seed CSV (rows minus the header) so the cap can never
        # drift from the seed list again.
        env:
          ATLAS_CRAWL_PROGRESS: "1"
          ATLAS_CORPUS_BACKEND: gcs
          ATLAS_CORPUS_BUCKET: ${{ secrets.ATLAS_CORPUS_BUCKET }}
          ATLAS_CORPUS_INDEX_BUCKET: ${{ secrets.ATLAS_CORPUS_INDEX_BUCKET }}
          ATLAS_GCP_PROJECT: ${{ secrets.ATLAS_GCP_PROJECT }}
          ATLAS_GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          seeds=$(awk 'END {print NR - 1}' data/partner-logo-seeds.csv)
          python3 scripts/crawl.py profiles --approved data/partner-logo-seeds.csv --follow 2 --limit "$seeds"
      - name: Collect company profiles
        # Issue #535: the deep company-profiles mode (newsroom funding
        # articles, professional bios, founder leads) now runs for every
        # approved company seed, not just in service of the portraits
        # step. A company-site outage degrades this step's snapshot only;
        # it must never skip the portrait and candidate steps.
        env:
          ATLAS_CRAWL_PROGRESS: "1"
          ATLAS_CORPUS_BACKEND: gcs
          ATLAS_CORPUS_BUCKET: ${{ secrets.ATLAS_CORPUS_BUCKET }}
          ATLAS_CORPUS_INDEX_BUCKET: ${{ secrets.ATLAS_CORPUS_INDEX_BUCKET }}
          ATLAS_GCP_PROJECT: ${{ secrets.ATLAS_GCP_PROJECT }}
          ATLAS_GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: python3 scripts/crawl.py company-profiles --approved data/company-profile-seeds.csv --follow 2
        continue-on-error: true
      - name: Stage founder and team portraits
        env:
          ATLAS_CRAWL_PROGRESS: "1"
          ATLAS_CORPUS_BACKEND: gcs
          ATLAS_CORPUS_BUCKET: ${{ secrets.ATLAS_CORPUS_BUCKET }}
          ATLAS_CORPUS_INDEX_BUCKET: ${{ secrets.ATLAS_CORPUS_INDEX_BUCKET }}
          ATLAS_GCP_PROJECT: ${{ secrets.ATLAS_GCP_PROJECT }}
          ATLAS_GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: python3 scripts/crawl.py portraits --approved data/company-profile-seeds.csv --follow 2
      - name: Prepare partner metadata for review
        env:
          ATLAS_CRAWL_PROGRESS: "1"
          ATLAS_CORPUS_BACKEND: gcs
          ATLAS_CORPUS_BUCKET: ${{ secrets.ATLAS_CORPUS_BUCKET }}
          ATLAS_CORPUS_INDEX_BUCKET: ${{ secrets.ATLAS_CORPUS_INDEX_BUCKET }}
          ATLAS_GCP_PROJECT: ${{ secrets.ATLAS_GCP_PROJECT }}
          ATLAS_GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: python3 scripts/crawl.py partner-candidates --approved data/partner-logo-seeds.csv --snapshot research/crawl/latest-logos.json
      - name: Summarize outputs
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for mode in ('partners', 'programs', 'news', 'logos', 'profiles', 'company-profiles', 'portraits'):
              path = Path('research/crawl') / f'latest-{mode}.json'
              if not path.exists():
                  print(f'{mode}: no snapshot')
                  continue
              data = json.loads(path.read_text())
              print(f"{mode}: {len(data.get('results', []))} sources; {len(data.get('candidates', []))} candidates")
              for row in data.get('results', []):
                  print(f"  {row.get('name')}: " + ', '.join(p.get('status', 'unknown') for p in row.get('pages', [])))
              for item in data.get('candidates', []) if mode == 'logos' else []:
                  print(f"  {item.get('partner')}: {item.get('kind')} {item.get('status')} {item.get('url')} {item.get('reason', '')}")
              for item in data.get('candidates', []) if mode == 'portraits' else []:
                  if item.get('kind') == 'portrait':
                      print(f"  {item.get('company')}: portrait {item.get('name')} {item.get('status')} {item.get('candidate_url')} {item.get('reason', '')}")
              for note in data.get('notes', []):
                  print(f"  note: {note}")
          PY
      - name: Build review queue
        # Issue #377: the queue builder is committed but nothing ran it,
        # so the queue was rebuilt by hand after each crawl. Generate it
        # into the run artifact, seeded from the committed queue so
        # decisions and dedup carry forward; landing the updated queue
        # back on main stays a reviewed data change.
        run: |
          cp data/review-queue.json research/crawl/review-queue.json
          python3 scripts/build-review-queue.py \
            --artifact-dir research/crawl \
            --run ${{ github.run_number }} \
            --queue research/crawl/review-queue.json \
            --summary-md research/crawl/review-queue-summary.md
      - name: Record crawl bookkeeping
        # Issue #538: data/crawl-runs.json only ever held manual partners
        # runs and data/crawl-source-state.json was an empty stub, because
        # nothing in the workflow recorded the mode runs or persisted
        # the sampler state. Build the updated registry and copy the state
        # file into the artifact; landing them back on main stays a
        # reviewed data change, like the review queue above.
        if: always()
        run: |
          cp data/crawl-runs.json research/crawl/crawl-runs.json
          python3 scripts/record_crawl_runs.py \
            --registry research/crawl/crawl-runs.json \
            --snapshots research/crawl \
            --catalogue-revision ${{ github.sha }} \
            --claimed-by github-actions \
            --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            --sequence ${{ github.run_number }}
          cp data/crawl-source-state.json research/crawl/crawl-source-state.json
          # Issue #532: the bookkeeping above counts pages and runs, never
          # entity completeness, so catalogue gaps were only found by hand.
          # Emit the gap report into the artifact with the registry: a
          # crawl does not count as done until it runs clean or its gaps
          # are filed.
          python3 scripts/crawl_gap_report.py \
            --graph data/graph.json \
            --out research/crawl/crawl-gap-report.json \
            --summary-md research/crawl/crawl-gap-report.md \
            --catalogue-revision ${{ github.sha }}
      - name: Preserve review material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-crawl-review
          path: research/crawl/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish crawl snapshots to the live-index corpus
        # High-throughput push: snapshots land in object storage immediately;
        # the async indexer (live-index.yml) picks them up from there. This
        # step never fails the crawl, and skips cleanly until the
        # ATLAS_CORPUS_* secrets exist.
        if: always()
        continue-on-error: true
        env:
          ATLAS_CORPUS_BACKEND: gcs
          ATLAS_CORPUS_BUCKET: ${{ secrets.ATLAS_CORPUS_BUCKET }}
          ATLAS_CORPUS_INDEX_BUCKET: ${{ secrets.ATLAS_CORPUS_INDEX_BUCKET }}
          ATLAS_GCP_PROJECT: ${{ secrets.ATLAS_GCP_PROJECT }}
          ATLAS_GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: python3 scripts/publish_crawl_corpus.py --snapshots research/crawl --run-id ${{ github.run_id }}
      - name: Stamp crawl progress terminal
        if: always()
        continue-on-error: true
        env:
          ATLAS_CRAWL_PROGRESS: "1"
          ATLAS_CORPUS_BACKEND: gcs
          ATLAS_CORPUS_BUCKET: ${{ secrets.ATLAS_CORPUS_BUCKET }}
          ATLAS_CORPUS_INDEX_BUCKET: ${{ secrets.ATLAS_CORPUS_INDEX_BUCKET }}
          ATLAS_GCP_PROJECT: ${{ secrets.ATLAS_GCP_PROJECT }}
          ATLAS_GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: python3 scripts/crawl_progress.py finalize --status ${{ job.status == 'success' && 'completed' || 'failed' }}
