<svg xmlns="http://www.w3.org/2000/svg" width="256" height="192" viewBox="0 0 256 192" role="img" aria-labelledby="evidence-stale-r1-title" aria-describedby="evidence-stale-r1-description">
  <title id="evidence-stale-r1-title">Stale — Signal evidence study r1, mono</title>
  <desc id="evidence-stale-r1-description">An intact source frame sits beside a time dial with separated hands. A recorded observation needs a freshness review under an explicit policy or recorded review decision. Experimental illustration. Actual condition, source, scope and dates must be supplied by adjacent text; no live record is encoded.</desc>
