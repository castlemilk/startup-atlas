<svg xmlns="http://www.w3.org/2000/svg" width="256" height="192" viewBox="0 0 256 192" role="img" aria-labelledby="evidence-reviewed-r1-title" aria-describedby="evidence-reviewed-r1-description">
  <title id="evidence-reviewed-r1-title">Reviewed — Signal evidence study r1, mono</title>
  <desc id="evidence-reviewed-r1-description">An intact source frame is paired with an annotation bracket and two review-note strokes. Specified evidence or a claim was examined within a recorded scope and review date. Experimental illustration. Actual condition, source, scope and dates must be supplied by adjacent text; no live record is encoded.</desc>
