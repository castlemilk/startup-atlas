  </g>
  <g id="annotation-bracket" fill="none" stroke="#111318" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222 62 H164 V144 H222" fill-rule="evenodd"/>
  </g>
  <g id="review-notation" fill="none" stroke="#111318" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
